name: ${COMPOSE_PROJECT_NAME:-webui-sandbox-kit}

x-logs: &logs
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

services:
  controller:
    build: .
    platform: linux/amd64
    init: true
    restart: unless-stopped
    user: '${KIT_UID:-1000}:${KIT_GID:-1000}'
    group_add: ['${KVM_GID:?Run ./kit init to detect the KVM group}']
    devices: [/dev/kvm:/dev/kvm]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=256m']
    pids_limit: 2048
    stop_grace_period: 90s
    volumes: ['${DATA_DIR:-./data}/controller:/data']
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-3000}:3000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    mem_limit: ${CONTROLLER_MEMORY:-10g}
    cpus: ${CONTROLLER_CPUS:-6}
    logging: *logs
    networks: [backend]

  firecrawl-api:
    profiles: [web]
    image: ghcr.io/firecrawl/firecrawl@sha256:ea491314e46976bd8cbd73e7420ac4dfdc8bf66fa8309af4741ad4ac1488b35e
    restart: unless-stopped
    init: true
    env_file: ['${DATA_DIR:-./data}/firecrawl/api.env']
    environment:
      HOST: 0.0.0.0
      PORT: '3002'
      ENV: local
      USE_DB_AUTHENTICATION: 'false'
      NUQ_BACKEND: pg
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright:3000/scrape
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      NUQ_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NUM_WORKERS_PER_QUEUE: '1'
      CRAWL_CONCURRENT_REQUESTS: '2'
      MAX_CONCURRENT_JOBS: '2'
      BROWSER_POOL_SIZE: '1'
      ALLOW_LOCAL_WEBHOOKS: 'false'
    command: [node, dist/src/harness.js, --start-docker]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      rabbitmq: {condition: service_healthy}
      playwright: {condition: service_started}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    logging: *logs
    networks: [backend]

  playwright:
    profiles: [web]
    image: ghcr.io/firecrawl/playwright-service@sha256:227ce3d8059173925a5a0697c63a1e947662cca934a609151651f578774edd5d
    restart: unless-stopped
    init: true
    environment:
      PORT: '3000'
      MAX_CONCURRENT_PAGES: '2'
      ALLOW_LOCAL_WEBHOOKS: 'false'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 256m
    mem_limit: 1g
    cpus: 1
    logging: *logs
    networks: [backend]

  postgres:
    profiles: [web]
    image: ghcr.io/firecrawl/nuq-postgres@sha256:d719b36160eac2fcbe16dc7e7360ddb9c82c40ea5da183d07bf4a755c6a0b2ae
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - '${DATA_DIR:-./data}/firecrawl/postgres:/var/lib/postgresql/data'
      - '${DATA_DIR:-./data}/firecrawl/postgres-password:/run/secrets/postgres-password:ro'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    logging: *logs
    networks: [backend]

  redis:
    profiles: [web]
    image: redis@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: ['${DATA_DIR:-./data}/firecrawl/redis:/data']
    mem_limit: 128m
    logging: *logs
    networks: [backend]

  rabbitmq:
    profiles: [web]
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    hostname: queue
    volumes: ['${DATA_DIR:-./data}/firecrawl/rabbitmq:/var/lib/rabbitmq']
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 384m
    logging: *logs
    networks: [backend]

networks:
  backend:
    ipam:
      config: [{subnet: '${KIT_SUBNET:?Run ./kit init to select an unused subnet}'}]
