name: unit-and-security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r controller/requirements.lock
      - run: python scripts/test.py reports/unit.json
      - run: python -m compileall -q controller guest scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: reports/unit.json
