name: unit-and-security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r controller/requirements.lock
      - run: python scripts/test.py reports/unit.json
      - run: python -m compileall -q controller guest scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: reports/unit.json
  frontier-browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontier/mcp-apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontier/mcp-apps/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: mkdir -p ../../reports && npm run test:browser
        env:
          FRONTIER_SIZING_REPORT: '${{ github.workspace }}/reports/frontier-sizing.json'
          FRONTIER_THEME_REPORT: '${{ github.workspace }}/reports/frontier-theme.json'
          FRONTIER_FILES_REPORT: '${{ github.workspace }}/reports/frontier-files.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-browser-results
          path: reports/frontier-*.json
